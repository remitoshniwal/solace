plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // The automatic build's "photo tour" (see ScreenshotTour.java). Off unless SOLACE_SCREENSHOTS is set.
            if (System.getenv('SOLACE_SCREENSHOTS') != null) {
                systemProperty 'solace.screenshots', 'true'
            }
            // SOLACE_TOUR=playtest tries the playtest tools in a fresh world and quits.
            if (System.getenv('SOLACE_TOUR') != null) {
                systemProperty 'solace.tour', System.getenv('SOLACE_TOUR')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Two players on one computer, for testing multiplayer (see docs/PLAYTEST.md):
        // ./gradlew runServer, then ./gradlew runPlayerA and ./gradlew runPlayerB, and join "localhost" from both.
        // Each has its own folder, so their settings and logs don't mix. They don't need an AI key (the server has it).
        playerA {
            client()
            gameDirectory = project.file('run/playerA')
            programArguments.addAll '--username', 'Remi'
        }
        playerB {
            client()
            gameDirectory = project.file('run/playerB')
            programArguments.addAll '--username', 'Friend'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Standalone tests for the AI code (they don't need Minecraft).
sourceSets {
    aiTest {
        java.srcDir 'src/aiTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('aiTest', JavaExec) {
    group = 'verification'
    description = 'Runs the AI provider/parser self-tests against a local fake server.'
    classpath = sourceSets.aiTest.runtimeClasspath
    mainClass = 'com.solacemod.solace.aitest.AiSelfTest'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Checks Solace's own sounds before building: every sound in sounds.json needs its .ogg files and a subtitle,
// and every sound registered in ModSounds.java needs an entry in sounds.json.
tasks.register('checkSounds') {
    group = 'verification'
    description = 'Checks that every Solace sound has its files, a subtitle and a sounds.json entry.'
    def assets = file('src/main/resources/assets/solace')
    def modSounds = file('src/main/java/com/solacemod/solace/util/ModSounds.java')
    inputs.dir(assets)
    inputs.file(modSounds)
    doLast {
        def sounds = new groovy.json.JsonSlurper().parse(new File(assets, 'sounds.json'))
        def lang = new groovy.json.JsonSlurper().parse(new File(assets, 'lang/en_us.json'))
        def problems = []
        sounds.each { name, entry ->
            if (!lang.containsKey(entry.subtitle)) problems << "${name}: no subtitle '${entry.subtitle}' in en_us.json"
            entry.sounds.each { s ->
                def path = (s instanceof Map ? s.name : s).replace('solace:', '')
                if (!new File(assets, "sounds/${path}.ogg").exists()) problems << "${name}: missing sounds/${path}.ogg"
            }
        }
        (modSounds.text =~ /register\("([a-z_]+)"/).each { match ->
            if (!sounds.containsKey(match[1])) problems << "${match[1]}: registered in ModSounds.java but not in sounds.json"
        }
        if (problems) throw new GradleException("Sound problems:\n  " + problems.join("\n  "))
    }
}

tasks.named('check') {
    dependsOn 'checkSounds'
}
