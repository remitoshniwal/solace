# Builds the mod on GitHub's computers every time you push.
# The finished .jar shows up under the "Actions" tab -> latest run -> "Artifacts".
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the workflow can create Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the mod
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Run the AI self-tests
        run: ./gradlew aiTest

      - name: Smoke test (start a real server with the mod)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          mkfifo server_in
          (sleep 100000 > server_in) &
          ./gradlew runServer < server_in > server.log 2>&1 &
          for i in $(seq 1 150); do
            if grep -q "Done (" server.log; then break; fi
            if grep -qi "crash report\|Failed to start the minecraft server" server.log; then break; fi
            sleep 2
          done
          if grep -q "Done (" server.log; then
            echo "summon solace:solace 0 100 0" > server_in
            echo "summon solace:watcher 2 100 2" > server_in
            echo "solace" > server_in
            # Phase 4 (multiplayer): with nobody online these must answer politely, never throw.
            echo "solace admin usage" > server_in
            echo "solace admin together nobody meet" > server_in
            # Phase 5 (after the ending): the same, for the new admin commands.
            echo "solace admin memory nobody show" > server_in
            echo "solace admin ending nobody erase" > server_in
            echo "solace admin afterward nobody meet" > server_in
            sleep 10
            echo "stop" > server_in
            sleep 20
          fi
          pkill -f "sleep 100000" || true
          grep -q "Done (" server.log && echo "::notice title=Server smoke test::Server started, Solace and Watcher summoned, /solace and the admin usage/together/memory/ending/afterward commands ran, no Solace errors" || { echo "::error title=Smoke test::Server did not start"; }
          # Report problems mentioning our mod, plus any crash.
          grep -n -i -B2 -A12 "exception\|crash report" server.log | grep -i -A12 -B2 "com\.solacemod\|crash report" | head -c 3800 > problems.txt || true
          # Pull the actual cause out of any crash report.
          for f in run/crash-reports/*.txt; do
            [ -f "$f" ] || continue
            { grep -m1 -A3 "Failure message" "$f"; grep -m1 -A30 "^Stacktrace:" "$f"; grep -A8 "Caused by" "$f"; } | head -c 3800 > crash.txt
            msg=$(sed 's/%/%25/g' crash.txt | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Crash report::${msg}"
          done
          if [ -s problems.txt ]; then
            msg=$(sed 's/%/%25/g' problems.txt | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Smoke test problems::${msg}"
            exit 1
          fi
          grep -q "Done (" server.log || exit 1
          grep -i "solace" server.log | tail -20

      - name: Client smoke test (start the game with the mod)
        run: |
          sudo apt-get install -y -qq xvfb mesa-utils > /dev/null 2>&1 || true
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > client.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if grep -q "Created: .*atlas" client.log; then ok=1; break; fi
            if grep -qi "crash report\|BUILD FAILED" client.log; then break; fi
            sleep 2
          done
          sleep 10
          pkill -f "runClient\|net.neoforged" || true
          pkill -f java || true
          grep -n -i -B2 -A14 "exception\|crash report" client.log | grep -i -A14 -B2 "com\.solacemod\|crash report" | head -c 3800 > cproblems.txt || true
          if [ -s cproblems.txt ]; then
            msg=$(sed 's/%/%25/g' cproblems.txt | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Client smoke test problems::${msg}"
            exit 1
          fi
          if [ $ok -ne 1 ]; then
            msg=$(tail -40 client.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Client did not finish loading::${msg}"
            exit 1
          fi
          echo "::notice title=Client smoke test::Client loaded to the title screen with no Solace errors"

      - name: Screenshots (photo tour of Solace's forms)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          rm -rf run/screenshots run/saves/solace_tour
          SOLACE_SCREENSHOTS=1 timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > shots.log 2>&1 || true
          ls -la run/screenshots || true
          n=$(ls run/screenshots/*.png 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            msg=$(grep -i "screenshots\|exception\|error\|caused by\|at com.solacemod" shots.log | grep -v -i "narrator\|flite" | tail -40 | cut -c 1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::warning title=No screenshots::${msg}"
            echo "----- end of the game log -----"
            grep -v -i "narrator\|flite" shots.log | tail -80 | cut -c 1-400
          else
            echo "::notice title=Screenshots::${n} screenshots taken"
          fi

      - name: Screenshots (bond hint, toasts, advancements tab)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          rm -rf run/saves/solace_tour
          SOLACE_TOUR=phase2 timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > shots2.log 2>&1 || true
          n=$(ls run/screenshots/p2_*.png 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            msg=$(grep -i "screenshots\|exception\|error\|caused by\|at com.solacemod" shots2.log | grep -v -i "narrator\|flite" | tail -40 | cut -c 1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::warning title=No phase 2 screenshots::${msg}"
          else
            echo "::notice title=Phase 2 screenshots::${n} screenshots taken"
          fi

      - name: Screenshots (multiplayer moments, played alone with a stand-in)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          rm -rf run/saves/solace_tour
          SOLACE_TOUR=together timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > shots3.log 2>&1 || true
          n=$(ls run/screenshots/t_*.png 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            msg=$(grep -i "screenshots\|exception\|error\|caused by\|at com.solacemod" shots3.log | grep -v -i "narrator\|flite" | tail -40 | cut -c 1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::warning title=No multiplayer screenshots::${msg}"
          else
            echo "::notice title=Multiplayer screenshots::${n} screenshots taken"
          fi
          grep -h "JEALOUSY\|WITNESS\|MEET\|RIPPLE\|HOLLOW\|personal freeze" run/solace/playtest/*.txt 2>/dev/null | tail -20 || true

      - name: Screenshots (after the ending, with faked memories)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          rm -rf run/saves/solace_tour
          SOLACE_TOUR=afterward timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > shots4.log 2>&1 || true
          n=$(ls run/screenshots/a_*.png 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            msg=$(grep -i "screenshots\|exception\|error\|caused by\|at com.solacemod" shots4.log | grep -v -i "narrator\|flite" | tail -40 | cut -c 1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::warning title=No after-the-ending screenshots::${msg}"
          else
            echo "::notice title=After-the-ending screenshots::${n} screenshots taken"
          fi
          grep -h "AFTER\|written line" run/solace/playtest/*.txt 2>/dev/null | tail -30 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: run/screenshots/*.png
          if-no-files-found: ignore

      - name: Show build errors
        if: failure()
        run: |
          # Turn compiler errors (or Gradle's failure reason) into readable error messages (each max ~4000 chars).
          if grep -q "error:" build.log; then
            grep -A1 "error:" build.log | grep -v "^--$" | sed 's#.*/src/main/java/com/solacemod/solace/##' > errors.txt
          else
            grep -A40 "What went wrong" build.log > errors.txt || tail -80 build.log > errors.txt
          fi
          split -C 3800 -a 2 errors.txt chunk_
          n=0
          for f in chunk_*; do
            n=$((n+1)); [ $n -gt 10 ] && break
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors $n::${msg}"
          done
          echo "Total error lines: $(grep -c 'error:' build.log || true)"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: solace-mod
          path: build/libs/*.jar

      # On every push to main: if there's no Release yet for the version in gradle.properties, publish one with the jar.
      # To release a new version, change mod_version in gradle.properties and push.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Change mod_version in gradle.properties to publish a new one."
          else
            gh release create "$TAG" build/libs/*.jar --target "$GITHUB_SHA" --title "Solace $TAG" --notes-file .github/release-notes.md
            echo "::notice title=Release::Published $TAG"
          fi
