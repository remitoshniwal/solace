# Builds the mod on GitHub's computers every time you push.
# The finished .jar shows up under the "Actions" tab -> latest run -> "Artifacts".
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Run the AI self-tests
        run: ./gradlew aiTest

      - name: Show build errors
        if: failure()
        run: |
          # Collect compiler errors (or Gradle's failure reason) into one readable error message.
          if grep -q "error:" build.log; then
            grep -B1 -A3 "error:" build.log | head -c 60000 > errors.txt
          else
            grep -A40 "What went wrong" build.log | head -c 60000 > errors.txt || tail -80 build.log > errors.txt
          fi
          msg=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: solace-mod
          path: build/libs/*.jar
