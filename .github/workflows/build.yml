# Builds the mod on GitHub's computers every time you push.
# The finished .jar shows up under the "Actions" tab -> latest run -> "Artifacts".
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Run the AI self-tests
        run: ./gradlew aiTest

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: solace-mod
          path: build/libs/*.jar
